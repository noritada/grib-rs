name: CI

on:
  push:
    branches: [master, testing, "release/v[0-9].[0-9]"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 21 * * *"

  workflow_dispatch:

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  lint_and_clippy:
    name: Lint and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Install dependencies needed to build proj
        run: sudo apt install libsqlite3-dev
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            workspace: --workspace
            features: --no-default-features
            with_test: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            workspace: --workspace
            features: --features time-calculation
            with_test: true
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-musl
          #   features: --features gridpoints-proj
          #   with_test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # workspace: --workspace
            features: --no-default-features --features jpeg2000-unpack-with-openjpeg,png-unpack-with-png-crate,ccsds-unpack-with-libaec
            with_test: true
          - os: macOS-latest
            target: x86_64-apple-darwin
            workspace: --workspace
            features: --no-default-features
            with_test: true
          - os: macOS-latest
            target: x86_64-apple-darwin
            workspace: --workspace
            features: --features time-calculation
            with_test: true
          - os: macOS-latest
            target: aarch64-apple-darwin
            workspace: --workspace
            features: --no-default-features
            with_test: false
          - os: macOS-latest
            target: aarch64-apple-darwin
            workspace: --workspace
            features: --features time-calculation
            with_test: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # - name: Set up musl
      #   if: matrix.target == 'x86_64-unknown-linux-musl'
      #   run: |
      #     rustup target add x86_64-unknown-linux-musl
      #     sudo apt -qq install musl-tools
      # - name: Set up C++ build tools for building PROJ
      #   if: matrix.target == 'x86_64-unknown-linux-musl'
      #   run: |
      #     sudo apt -qq install build-essential g++-multilib
      #     sudo ln -s /usr/bin/g++ /usr/bin/musl-g++
      - name: Install dependencies needed to build proj
        run: sudo apt install libsqlite3-dev
        if: matrix.os == 'ubuntu-latest'
      - name: Build
        run: cargo build --target ${{ matrix.target }} --verbose ${{ matrix.workspace }} ${{ matrix.features }}
      - name: Run tests
        if: matrix.with_test
        run: cargo test --target ${{ matrix.target }} --verbose ${{ matrix.workspace }} ${{ matrix.features }}

  test_rust_aec_ccsds:
    name: Test Rust AEC CCSDS backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust AEC CCSDS tests
        run: cargo test --verbose -p grib --no-default-features --features ccsds-unpack-with-rust-aec

  test_hayro_jpeg2000:
    name: Test hayro JPEG 2000 backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run hayro JPEG 2000 tests
        run: cargo test --verbose -p grib --no-default-features --features jpeg2000-unpack-with-hayro
      - name: Verify hayro JPEG 2000 priority over OpenJPEG
        run: cargo test --verbose -p grib --no-default-features --features jpeg2000-unpack-with-openjpeg,jpeg2000-unpack-with-hayro

  build_wasm:
    name: Building library for wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build
        run: cargo build --target wasm32-unknown-unknown --verbose --no-default-features --features wasm-default

  address_sanitizer:
    name: Address sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install dependencies needed to build proj
        run: sudo apt install libsqlite3-dev
      - name: Run test with sanitizer
        env:
          RUSTFLAGS: -Z sanitizer=address
          RUSTDOCFLAGS: -Z sanitizer=address
        run: cargo test --target x86_64-unknown-linux-gnu --workspace --features gridpoints-proj,jpeg2000-unpack-with-openjpeg,png-unpack-with-png-crate,ccsds-unpack-with-libaec

  check_github_config_formats:
    name: Check GitHub config formats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Prettier
        run: npm install -g prettier
      - name: Run prettier
        run: prettier .github --check
